<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency Flood Warning & Risk Mode — Sri Lanka FloodWatch</title>
  <meta name="description" content="Low-bandwidth emergency flood prediction and official warning status for Sri Lanka.">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; color: #f1f5f9; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-rose-500 selection:text-white">
  
  <!-- Header Bar -->
  <header class="w-full border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50 px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <a href="index.html" class="flex items-center gap-2 text-rose-400 font-extrabold text-base hover:opacity-90">
          <span class="w-3 h-3 rounded-full bg-rose-500 animate-pulse"></span>
          <span>FloodWatch Emergency</span>
        </a>
      </div>
      <div class="flex items-center gap-2">
        <!-- Language Selector -->
        <select id="lang-select" class="bg-slate-800 border border-slate-700 text-xs text-slate-200 font-bold rounded-lg px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-rose-500" aria-label="Select Language">
          <option value="en">EN</option>
          <option value="si">සිං</option>
          <option value="ta">தமி</option>
        </select>
        <!-- Mode Switcher -->
        <a href="index.html" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-sky-400 font-bold rounded-lg px-2.5 py-1.5 transition-colors">
          Normal Mode
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-grow w-full py-4" id="main-content">
    
    <!-- Location Select Bar -->
    <div class="max-w-md mx-auto px-4 mb-4">
      <label for="location-select" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5" data-i18n="homepage.select_area">Select Area</label>
      <select id="location-select" class="w-full bg-slate-800 border-2 border-slate-700 text-white font-bold rounded-xl px-4 py-3 text-base focus:border-rose-500 focus:outline-none shadow-lg">
        <option value="RATNAPURA_001" selected>Ratnapura (Station #7)</option>
        <option value="KOLONNAWA_001">Kolonnawa (Station #1)</option>
        <option value="HANWELLA_001">Hanwella (Station #2)</option>
        <option value="GLENCORSE_001">Glencorse (Station #3)</option>
        <option value="DERANIYAGALA_001">Deraniyagala (Station #4)</option>
        <option value="KITULGALA_001">Kitulgala (Station #5)</option>
        <option value="HOLOMBUWA_001">Holombuwa (Station #6)</option>
        <option value="ELLAGAWA_001">Ellagawa (Station #8)</option>
        <option value="MAGURA_001">Magura (Station #9)</option>
        <option value="BADDEGAMA_001">Baddegama (Station #10)</option>
      </select>
    </div>

    <!-- Dynamic Emergency Container -->
    <div id="emergency-container" aria-live="polite">
      <div class="max-w-md mx-auto p-6 text-center text-slate-400 animate-pulse">
        <div class="text-sm font-semibold mb-2">Loading emergency flood data...</div>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="w-full border-t border-slate-800 bg-slate-900/60 py-4 px-4 text-center text-xs text-slate-500">
    <div class="max-w-md mx-auto flex flex-col gap-1">
      <div>Disaster Management Centre (DMC) Hotline: <a href="tel:117" class="text-rose-400 font-bold hover:underline">117</a></div>
      <div>Sri Lanka FloodWatch Emergency & Low-Bandwidth Mode</div>
    </div>
  </footer>

  <script type="module">
    import { EmergencyEngine } from './js/emergency.js';
    import { i18n } from './js/i18n.js';
    import { api } from './js/api.js';

    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Initialize language
      const savedLang = localStorage.getItem('floodwatch_lang') || 'en';
      i18n.setLanguage(savedLang);
      const langSelect = document.getElementById('lang-select');
      if (langSelect) {
        langSelect.value = savedLang;
        langSelect.addEventListener('change', (e) => {
          const newLang = e.target.value;
          i18n.setLanguage(newLang);
          engine.fetchAndRender(engine.currentLocationId, { lang: newLang });
        });
      }

      // 2. Populate locations dropdown dynamically if API succeeds
      const locSelect = document.getElementById('location-select');
      try {
        const locRes = await api.getLocations();
        if (locRes && locRes.locations && locRes.locations.length > 0) {
          locSelect.innerHTML = locRes.locations.map(loc => `
            <option value="${loc.id}">${i18n.getStationName(loc.id, loc.place_name || loc.name)} (${loc.district || ''})</option>
          `).join('');
        }
      } catch (e) {
        // Safe offline fallback: static location list remains intact
      }

      // 3. Initialize Emergency Engine
      const initialLoc = localStorage.getItem('floodwatch_selected_location_id') || 'RATNAPURA_001';
      locSelect.value = initialLoc;

      const engine = new EmergencyEngine({
        containerId: 'emergency-container',
        locationId: initialLoc,
        lang: savedLang,
        isEmergencyMode: true
      });

      engine.fetchAndRender(initialLoc);

      locSelect.addEventListener('change', (e) => {
        const selectedId = e.target.value;
        localStorage.setItem('floodwatch_selected_location_id', selectedId);
        engine.fetchAndRender(selectedId);
      });

      // 4. Register Service Worker if supported
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(err => console.warn('Service Worker registration skipped:', err));
      }
    });
  </script>
</body>
</html>
