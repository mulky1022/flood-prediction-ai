name: Quality Engineering CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  test:
    name: Automated Testing & Quality Engineering
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run Phase 18 Quality Engineering Test Suite
        env:
          ENVIRONMENT: test
          TESTING: 'True'
          ADMIN_API_KEY: admin-secret-token-v17
        run: |
          pytest tests/quality_engineering/ -v --cov=. --cov-report=term-missing

      - name: Run Full Application Test Suite
        env:
          ENVIRONMENT: test
          TESTING: 'True'
          ADMIN_API_KEY: admin-secret-token-v17
        run: |
          pytest -v
