[project]
name = "app"
version = "0.1.0"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scikit-learn==1.6.1",
    "scipy==1.13.1",
    "joblib==1.4.2",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "supabase>=2.4.0",
    "python-dotenv>=1.0.0"
]
requires-python = "~=3.11.0"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
